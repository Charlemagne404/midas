[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midas-lab"
version = "0.2.0"
description = "Read-only prediction-market intelligence and deterministic exchange laboratory"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "httpx>=0.28,<1",
    "websockets>=15,<16",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.15,<2",
    "aiosqlite>=0.21,<1",
    "asyncpg>=0.30,<1",
    "structlog>=25,<26",
    "eth-hash[pycryptodome]>=0.7,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "hypothesis>=6.130,<7", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["packages/midas", "apps"]
exclude = ["apps/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests", "infra"]
