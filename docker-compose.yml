services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: midas
      POSTGRES_PASSWORD: midas_local
      POSTGRES_DB: midas
    volumes:
      - midas-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midas -d midas"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      MIDAS_MODE: ${MIDAS_MODE:-demo}
      MIDAS_DATABASE_URL: postgresql+asyncpg://midas:midas_local@db:5432/midas
    volumes:
      - midas-recordings:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  midas-postgres:
  midas-recordings:
