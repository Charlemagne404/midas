name: Optional public data smoke
on: workflow_dispatch

permissions:
  contents: read

jobs:
  public-reads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run python scripts/live_smoke.py
      - run: uv run python scripts/verify_economics.py
      - run: uv run python scripts/live_paper_smoke.py
