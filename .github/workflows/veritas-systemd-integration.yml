name: Veritas isolated systemd integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  veritas-systemd-e2e:
    name: Veritas service through real systemd and cgroup v2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: 3.12.3

      - name: Verify hosted VM systemd and cgroup v2
        run: |
          set -euo pipefail
          pid1="$(cat /proc/1/comm)"
          printf 'PID 1: %s\n' "$pid1"
          test "$pid1" = systemd || { echo 'PID 1 is not systemd'; exit 1; }
          cgroup_mount="$(awk '$3 == "cgroup2" { print; exit }' /proc/mounts)"
          printf 'cgroup v2 mount: %s\n' "${cgroup_mount:-missing}"
          test -n "$cgroup_mount" || { echo 'cgroup v2 is not mounted'; exit 1; }
          for production_path in /home/charlie/midas/data /home/charlie/midas-veritas \
            /mnt/continental-cloud/data/midas-backups; do
            test ! -e "$production_path" || {
              echo "production data path is visible on the hosted runner: $production_path"
              exit 1
            }
          done
          manager_state="$(systemctl is-system-running --wait || true)"
          printf 'systemd state: %s\n' "$manager_state"
          test "$manager_state" = running || test "$manager_state" = degraded
          systemd --version

      - name: Create a dedicated user manager with delegated controllers
        run: |
          set -euo pipefail
          sudo useradd --create-home --shell /bin/bash midas-ci
          uid="$(id -u midas-ci)"
          sudo mkdir -p /etc/systemd/system/user@.service.d
          sudo tee /etc/systemd/system/user@.service.d/50-midas-ci-delegate.conf >/dev/null <<'EOF'
          [Service]
          Delegate=cpu memory io pids
          EOF
          sudo systemctl daemon-reload
          sudo loginctl enable-linger midas-ci
          sudo systemctl start "user-runtime-dir@${uid}.service" "user@${uid}.service"
          runtime="/run/user/${uid}"
          for attempt in $(seq 1 30); do
            if sudo -u midas-ci env XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          sudo -u midas-ci env XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment >/dev/null
          cgroup="/sys/fs/cgroup/user.slice/user-${uid}.slice/user@${uid}.service"
          available_controllers="$(cat "$cgroup/cgroup.controllers")"
          enabled_controllers="$(cat "$cgroup/cgroup.subtree_control")"
          printf 'delegated controllers: %s\nenabled child controllers: %s\n' \
            "$available_controllers" "$enabled_controllers"
          for controller in cpu memory io pids; do
            grep -qw "$controller" <<< "$available_controllers"
          done
          # The user manager enables delegated controllers when it creates a
          # transient worker. Requiring them to be pre-enabled here rejects a
          # valid delegated hierarchy before systemd can apply the unit limits.
          sudo -u midas-ci test -w "$cgroup/cgroup.subtree_control"
          echo "MIDAS_CI_UID=$uid" >> "$GITHUB_ENV"
          echo "MIDAS_CI_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Install pinned Veritas runtime
        env:
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          sudo -u midas-ci env HOME=/home/midas-ci "$PYTHON_BIN" -m venv /home/midas-ci/midas/.venv
          sudo -u midas-ci /home/midas-ci/midas/.venv/bin/python -m pip install --disable-pip-version-check \
            annotated-types==0.8.0 joblib==1.6.0 numpy==2.2.6 pydantic==2.14.0 \
            pydantic-core==2.50.0 scikit-learn==1.7.2 scipy==1.18.1 \
            threadpoolctl==3.7.0 typing-extensions==4.16.0 typing-inspection==0.4.4 \
            pytest==8.4.2
          release="/home/midas-ci/.local/share/midas-veritas/releases/veritas-guarded-streaming-683346e0-isolated-imports-v4"
          release_source="$RUNNER_TEMP/veritas-guarded-release"
          test ! -e "$release_source" && test ! -e "$release"
          runtime_site_packages="$(sudo -u midas-ci /home/midas-ci/midas/.venv/bin/python \
            -c 'import site; print(site.getsitepackages()[0])')"
          PYTHONPATH="$runtime_site_packages" "$PYTHON_BIN" \
            scripts/ci/build_veritas_systemd_release.py \
            --revision "$GITHUB_SHA" --destination "$release_source"
          sudo install -d -o midas-ci -g midas-ci "$(dirname "$release")"
          sudo cp -a "$release_source" "$release"
          sudo chown -R midas-ci:midas-ci "$release"
          tools="/home/midas-ci/midas-ci-tools"
          sudo install -D -o midas-ci -g midas-ci -m 0444 scripts/midas_resource_preflight.py \
            "$tools/scripts/midas_resource_preflight.py"
          sudo install -D -o midas-ci -g midas-ci -m 0444 scripts/ci/prepare_veritas_systemd_fixture.py \
            "$tools/scripts/ci/prepare_veritas_systemd_fixture.py"
          sudo install -D -o midas-ci -g midas-ci -m 0444 scripts/ci/run_veritas_systemd_e2e.py \
            "$tools/scripts/ci/run_veritas_systemd_e2e.py"
          sudo install -D -o midas-ci -g midas-ci -m 0444 \
            deploy/systemd/user/midas-veritas-source-analysis.timer \
            "$tools/deploy/systemd/user/midas-veritas-source-analysis.timer"
          sudo install -D -o midas-ci -g midas-ci -m 0444 \
            deploy/systemd/user/midas-reality-capacity.timer \
            "$tools/deploy/systemd/user/midas-reality-capacity.timer"
          sudo install -d -o midas-ci -g midas-ci \
            /home/midas-ci/.local/state/midas/guarded-executions
          sudo -u midas-ci mkdir -p /home/midas-ci/midas-veritas/packages/midas/veritas \
            /home/midas-ci/midas-veritas/data/veritas-observatory
          sudo -u midas-ci cp "$release/rollback/previous-finalized_source_analysis.py" \
            /home/midas-ci/midas-veritas/packages/midas/veritas/finalized_source_analysis.py
          sudo -u midas-ci chmod 0444 /home/midas-ci/midas-veritas/packages/midas/veritas/finalized_source_analysis.py
          sudo chown -R midas-ci:midas-ci /home/midas-ci/midas /home/midas-ci/midas-veritas \
            /home/midas-ci/.local
          sudo chown -R midas-ci:midas-ci "$tools"
          sudo -u midas-ci env HOME=/home/midas-ci PYTHONPATH="$release/packages" \
            /home/midas-ci/midas/.venv/bin/python "$tools/scripts/ci/prepare_veritas_systemd_fixture.py"

      - name: Run the exact guarded service through the isolated user manager
        run: |
          set -euo pipefail
          sudo -u midas-ci env HOME=/home/midas-ci XDG_RUNTIME_DIR="$MIDAS_CI_RUNTIME_DIR" \
            PYTHONPATH="/home/midas-ci/midas-ci-tools/scripts" \
            /home/midas-ci/midas/.venv/bin/python \
            /home/midas-ci/midas-ci-tools/scripts/ci/run_veritas_systemd_e2e.py \
            | tee "$RUNNER_TEMP/veritas-systemd-e2e.json"
          cat "$RUNNER_TEMP/veritas-systemd-e2e.json" >> "$GITHUB_STEP_SUMMARY"
