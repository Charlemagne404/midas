name: Midas offline verification
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: c83320000a085bf30490b4b76b425527fe8574f7
          path: validation-capacity-base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          # Fixed pre-fix source for an isolated memory comparison in backend CI.
          ref: 3e700b9b2bba7a9da1564e3ab8b2e18be2eba6ea
          path: veritas-memory-baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          # The exact Reality v5 source still loaded by the active service.
          ref: d8629e4b63c8b8ef68e27294fb3599423a694b76
          path: reality-v5-baseline
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          # The exact bounded Reality v6 source at the start of this maintenance task.
          ref: 7ab2d0d98d71e32c7ce7a62275afdc8f45402f04
          path: reality-v6-main
          fetch-depth: 1
          persist-credentials: false
      - name: Run bounded, isolated backend validation
        run: bash .github/ci-test-support/run-backend-container.sh
      - name: Verify Veritas source analysis under the 256 MiB no-swap limit
        env:
          MIDAS_CI_IMAGE: midas-ci-backend:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          fixture_root="$RUNNER_TEMP/midas-veritas-memory-fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 .github/ci-test-support/prepare-veritas-catalog-fixture.py \
            --root "$fixture_root"
          docker run --rm --network=none \
            --memory=256m --memory-swap=256m --cpus=1 --pids-limit=64 \
            --read-only --cap-drop=ALL --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=1777 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/veritas-memory-baseline,dst=/veritas-memory-baseline,readonly" \
            --mount "type=bind,src=$fixture_root,dst=/veritas-fixtures,readonly" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/source/packages \
            --env HOME=/home/midas --env TMPDIR=/tmp \
            "$MIDAS_CI_IMAGE" /opt/venv/bin/python \
            /source/.github/ci-test-support/measure-veritas-catalog-memory.py \
            --current-root /source --baseline-root /veritas-memory-baseline \
            --catalog-counts 58367 --current-only --fixture-root /veritas-fixtures
      - name: Compare Reality v5, main v6, and candidate under the service limits
        run: |
          python3 .github/ci-test-support/run-reality-capacity-benchmarks.py \
            --source-root "$GITHUB_WORKSPACE" \
            --baseline-root "$GITHUB_WORKSPACE/reality-v5-baseline" \
            --main-root "$GITHUB_WORKSPACE/reality-v6-main" \
            --runner-temp "$RUNNER_TEMP" \
            --image "midas-ci-backend:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --run-key "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/midas-ci-backend-data-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Frontend component tests
        run: pnpm --dir apps/web exec vitest run --maxWorkers=2 --minWorkers=1
      - run: pnpm build

  systemd-unit-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the real systemd unit parser
        run: command -v systemd-analyze
      - name: Install the locked pytest version
        run: python -m pip install pytest==8.4.2
      - name: Parse generated user service and timer units
        run: >-
          python -m pytest
          tests/arena/test_schedule_timer_install.py::test_generated_units_pass_real_systemd_parser
          -q

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMPDIR: ${{ github.workspace }}/.midas-browser-tmp-${{ github.run_id }}-${{ github.run_attempt }}
      MIDAS_PHASE5_SYNTHETIC_USER_PSI: "1"
      MIDAS_PHASE5_TEST_SUPPORT_ROOT: ${{ github.workspace }}/.github/ci-test-support
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare disposable browser temp root
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          export MIDAS_BLOCKED_COMMAND_LOG="$TMPDIR/shim-probe.log"
          for command in systemctl systemd-run busctl dbus-send gdbus sudo; do
            set +e
            PATH="$MIDAS_PHASE5_TEST_SUPPORT_ROOT/bin:$PATH" \
              "$command" --midas-ci-isolation-probe >/dev/null 2>&1
            status=$?
            set -e
            test "$status" -eq 125 || { echo "$command blocker failed closed" >&2; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group arena-rl
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Run standard browser suite with isolated synthetic resource PSI
        run: pnpm --dir apps/web exec playwright test --workers=1
      - name: Run captured Frontier browser coverage
        env:
          MIDAS_FRONTIER_E2E_CAPTURED: "1"
        run: >-
          pnpm --dir apps/web exec playwright test --workers=1
          --grep 'Frontier renders captured public market|Frontier deterministically replays captured books|Frontier primary views fit a narrow viewport'
      - name: Run seeded Frontier browser coverage
        env:
          MIDAS_SEED_FRONTIER_E2E: "1"
        run: >-
          pnpm --dir apps/web exec playwright test --workers=1
          --grep 'seeded Frontier history pages|seeded Frontier discovery artifact'
      - name: Run isolated Reality browser coverage
        run: pnpm --dir apps/web exec playwright test --config playwright.reality.config.ts --workers=1
      - name: Verify browser service commands were intercepted before reaching host
        run: |
          python3 - "$TMPDIR" <<'PY'
          import sys
          from pathlib import Path

          allowed = ("systemctl", "systemd-run", "busctl", "dbus-send", "gdbus", "sudo")
          logs = Path(sys.argv[1]).rglob("blocked-commands.log")
          blocked = 0
          for path in logs:
              for line in path.read_text().splitlines():
                  if not any(line.startswith(f"blocked {command} ") for command in allowed):
                      raise SystemExit(f"unexpected service-command shim log entry: {line}")
                  blocked += 1
          print(f"Fail-closed shims intercepted {blocked} systemd or bus command attempts.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-artifacts
          path: |
            ${{ github.workspace }}/.midas-browser-tmp-${{ github.run_id }}-${{ github.run_attempt }}/midas-browser-*/test-results
            ${{ github.workspace }}/.midas-browser-tmp-${{ github.run_id }}-${{ github.run_attempt }}/midas-reality-browser-*/test-results
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: midas
          POSTGRES_PASSWORD: midas_local
          POSTGRES_DB: midas_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U midas -d midas_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIDAS_MODE: demo
      MIDAS_DATABASE_URL: postgresql+asyncpg://midas:midas_local@localhost:5432/midas_ci
      MIDAS_RUNTIME_ROOT: ${{ github.workspace }}/.midas-postgres-${{ github.run_id }}-${{ github.run_attempt }}/runtime
      MIDAS_RECORDING_ROOT: ${{ github.workspace }}/.midas-postgres-${{ github.run_id }}-${{ github.run_attempt }}/recordings
      MIDAS_LABORATORY_ROOT: ${{ github.workspace }}/.midas-postgres-${{ github.run_id }}-${{ github.run_attempt }}/laboratory
      MIDAS_ARENA_ROOT: ${{ github.workspace }}/.midas-postgres-${{ github.run_id }}-${{ github.run_attempt }}/arena
      MIDAS_FRONTIER_ROOT: ${{ github.workspace }}/.midas-postgres-${{ github.run_id }}-${{ github.run_attempt }}/frontier
      MIDAS_REALITY_WORKSPACE: ${{ github.workspace }}/.midas-postgres-${{ github.run_id }}-${{ github.run_attempt }}/reality
      MIDAS_VERITAS_WORKSPACE: ${{ github.workspace }}/.midas-postgres-${{ github.run_id }}-${{ github.run_attempt }}/veritas
      MIDAS_FRONTIER_POLYMARKET_PUBLIC_PROBE_ENABLED: "false"
      MIDAS_FRONTIER_KALSHI_PUBLIC_PROBE_ENABLED: "false"
      MIDAS_FRONTIER_KRAKEN_PUBLIC_PROBE_ENABLED: "false"
      MIDAS_FRONTIER_COINBASE_PUBLIC_PROBE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - run: uv python install 3.12
      - name: Prepare disposable migration roots
        run: mkdir -p "$MIDAS_RUNTIME_ROOT" "$MIDAS_RECORDING_ROOT" "$MIDAS_LABORATORY_ROOT" "$MIDAS_ARENA_ROOT" "$MIDAS_FRONTIER_ROOT" "$MIDAS_REALITY_WORKSPACE" "$MIDAS_VERITAS_WORKSPACE"
      - run: uv sync --frozen
      - name: Apply migrations to synthetic PostgreSQL
        run: uv run alembic upgrade head
      - name: Verify PostgreSQL storage path
        run: uv run python scripts/storage_smoke.py
      - name: Verify PostgreSQL paper recovery
        run: uv run pytest tests/integration/test_postgres_paper.py -q
        env:
          MIDAS_TEST_POSTGRES_URL: postgresql+asyncpg://midas:midas_local@localhost:5432/midas_ci
